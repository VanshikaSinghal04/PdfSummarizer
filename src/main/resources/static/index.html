<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
  <title>PDF Summarizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f2f5;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #e5e5e5;
      width: 350px;
    }
    h1 { color: #111; font-size: 24px; }
    p  { color: #888; font-size: 14px; margin-bottom: 30px; }
    .login-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #1D9E75;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }
    .login-btn:hover { background: #0F6E56; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 PDF Summarizer</h1>
    <p>Login with Google to start summarizing your PDFs using AI!</p>
    <a href="/oauth2/authorization/google" class="login-btn">
      🔐 Login with Google
    </a>
  </div>
</body>
</html>
