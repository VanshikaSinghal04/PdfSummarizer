<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Summarizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
      border: 1px solid #e5e5e5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    h1 { font-size: 22px; font-weight: 600; color: #111; }
    .logout-btn {
      padding: 6px 14px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      color: #333;
    }
    .drop-zone {
      border: 2px dashed #d0d0d0;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 20px;
    }
    .drop-zone:hover { border-color: #1D9E75; background: #f0fbf7; }
    .drop-icon { font-size: 40px; margin-bottom: 12px; }
    .drop-text { font-size: 14px; color: #666; }
    .drop-text span { color: #1D9E75; font-weight: 500; }
    .file-chosen { font-size: 13px; color: #1D9E75; margin-top: 10px; }
    input[type="file"] { display: none; }
    button.upload-btn {
      width: 100%; padding: 13px;
      background: #1D9E75; color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 500;
      cursor: pointer;
    }
    button.upload-btn:hover { background: #0F6E56; }
    button.upload-btn:disabled { background: #ccc; cursor: default; }
    .status {
      margin-top: 18px; padding: 13px 16px;
      border-radius: 10px; font-size: 14px; display: none;
    }
    .status.info    { background: #EBF5FF; color: #1558a5; display: block; }
    .status.success { background: #EDFAF4; color: #085041; display: block; }
    .status.error   { background: #FEF2F2; color: #991b1b; display: block; }
    .spinner {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid #b5d4f4; border-top-color: #1558a5;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-right: 7px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .summary-box {
      margin-top: 20px; background: #f9f9f9;
      border: 1px solid #e5e5e5; border-radius: 10px;
      padding: 20px; display: none;
    }
    .summary-box h2 { font-size: 14px; font-weight: 600; color: #444; margin-bottom: 10px; }
    .summary-box p  { font-size: 14px; color: #333; line-height: 1.75; white-space: pre-wrap; }
    .copy-btn {
      margin-top: 14px; padding: 7px 16px;
      background: #f0f0f0; color: #333;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; cursor: pointer;
    }
    .history-box {
    margin-top: 20px;
    background: #f9f9f9;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 20px;
}
.history-box h2 {
    font-size: 14px;
    font-weight: 600;
    color: #444;
    margin-bottom: 10px;
}
.history-item {
    padding: 10px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
}
.history-item:last-child { border-bottom: none; }
.view-btn {
    padding: 4px 10px;
    background: #1D9E75;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>📄 PDF Summarizer</h1>
    <a href="/logout" class="logout-btn">Logout</a>
  </div>

  <div class="drop-zone" id="dropZone" 
       onclick="document.getElementById('fileInput').click()">
    <div class="drop-icon">📂</div>
    <p class="drop-text">
      Drag & drop your PDF here, or <span>browse files</span>
    </p>
    <p class="file-chosen" id="fileName"></p>
  </div>
  <input type="file" id="fileInput" accept="application/pdf" />

  <button class="upload-btn" id="uploadBtn" 
          onclick="uploadPdf()" disabled>
    Upload & Summarize
  </button>
  <button class="copy-btn" onclick="createCliToken()">
    Create CLI token
  </button>

  <div id="cliTokenBox" style="display: none;">
    <p>Copy this token into your CLI. Keep it private.</p>
    <textarea id="cliToken" rows="4" readonly></textarea>
    <button class="copy-btn" onclick="copyCliToken()">Copy token</button>
  </div>

  <div class="status" id="status"></div>

  <div class="summary-box" id="summaryBox">
    <h2>✨ Summary</h2>
    <p id="summaryText"></p>
    <button class="copy-btn" onclick="copySummary()">
      Copy to clipboard
    </button>
  </div>
</div>
<!-- History Section -->
<div class="history-box" id="historyBox">
    <h2>📋 Your Previous Summaries</h2>
    <div id="historyList">Loading...</div>
</div>

<script>
  const fileInput = document.getElementById("fileInput");
  const uploadBtn = document.getElementById("uploadBtn");
  let selectedFile = null;
  let apiJwt = "";

  fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0];
    document.getElementById("fileName").textContent = 
      "✅ " + selectedFile.name;
    uploadBtn.disabled = false;
  });
  async function createCliToken() {
    const response = await fetch("/api-tokens", {
      method: "POST"
    });

    if (!response.ok) {
      alert("Could not create the token. Please sign in again.");
      return;
    }

    const result = await response.json();
    apiJwt = result.token;

    document.getElementById("cliToken").value = result.token;
    document.getElementById("cliTokenBox").style.display = "block";
  }

  function copyCliToken() {
    const token = document.getElementById("cliToken").value;

    navigator.clipboard.writeText(token)
            .then(() => alert("Token copied."));
  }

  async function uploadPdf() {//this function handles the PDF upload and initiates the summarization process
    if (!selectedFile) return;
    uploadBtn.disabled = true;
    document.getElementById("summaryBox").style.display = "none";
    showStatus("info", 
      '<span class="spinner"></span> Uploading your PDF...');

    const formData = new FormData();
    formData.append("pdf", selectedFile);

    try {
      const res  = await fetch("/upload", { 
        method: "POST", body: formData 
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Upload failed");

      showStatus("info", 
        '<span class="spinner"></span> Summarizing with AI...');
      pollForSummary(data.jobId);
    } catch (err) {
      showStatus("error", "❌ " + err.message);
      uploadBtn.disabled = false;
    }
  }

  function pollForSummary(jobId) {
    let attempts = 0;
    const timer = setInterval(async () => {
      attempts++;
      if (attempts > 40) {
        clearInterval(timer);
        showStatus("error", "❌ Timed out. Please try again.");
        uploadBtn.disabled = false;
        return;
      }
      try {
        const res  = await fetch(
          "/summary?jobId=" + encodeURIComponent(jobId),
            {
                headers: {
                "Authorization": "Bearer " + apiJwt
                }
            });
        const data = await res.json();
        if (data.ready) {
          clearInterval(timer);
          showStatus("success", "✅ Summary ready!");
          document.getElementById("summaryText").textContent = 
            data.summary;
          document.getElementById("summaryBox").style.display = 
            "block";
          uploadBtn.disabled = false;
        }
      } catch (e) { /* keep polling */ }
    }, 3000);
  }

  function showStatus(type, html) {
    const el = document.getElementById("status");
    el.className = "status " + type;
    el.innerHTML = html;
  }

  function copySummary() {
    navigator.clipboard.writeText(
      document.getElementById("summaryText").textContent)
      .then(() => alert("Copied!"));
  }
  // Load history when page opens
window.onload = function() {
    loadHistory();
}

async function loadHistory() {
    try {
        const res = await fetch("/history");
        const data = await res.json();
        
        const historyList = document.getElementById("historyList");
        
        if (data.length === 0) {
            historyList.innerHTML = 
                '<p style="color:#888;font-size:13px">No summaries yet. Upload your first PDF!</p>';
            return;
        }

        historyList.innerHTML = data.map(item => `
            <div class="history-item">
                <div>
                    <strong>${item.filename}</strong><br>
                    <small style="color:#888">${item.createdAt.substring(0,10)}</small>
                </div>
                <button class="view-btn" 
                    onclick="viewSummary('${item.summaryKey}')">
                    View
                </button>
            </div>
        `).join("");

    } catch (e) {
        document.getElementById("historyList").innerHTML = 
            '<p style="color:#888">Could not load history.</p>';
    }
}

async function viewSummary(summaryKey) {
    showStatus("info", 
        '<span class="spinner"></span> Loading summary...');
    
    try {
        const res = await fetch(
            "/summary?jobId=" + encodeURIComponent(summaryKey),
      {
        headers: {
          "Authorization"
        :
          "Bearer " + apiJwt
        }
      });

        const data = await res.json();

        if (data.ready) {
          document.getElementById("summaryText").textContent =
                  data.summary;
          document.getElementById("summaryBox").style.display =
                  "block";
          showStatus("success", "✅ Summary loaded!");
        } else {
          showStatus("info", "⏳ This summary is still processing...");
        }
      }
        catch (e)
        {
        showStatus("error", "❌ Could not load summary.");
    }}

</script>
</body>
</html>
